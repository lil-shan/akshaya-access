[pytest]
pythonpath = .
testpaths = tests
# This machine's PYTHONPATH includes ROS 2 (/opt/ros/jazzy), whose pytest plugins break outside a ROS env.
# Disabling them is harmless where ROS is not installed.
addopts = -p no:launch_testing -p no:launch_ros -p no:ament_lint -p no:ament_copyright -p no:ament_flake8
          -p no:ament_pep257 -p no:ament_xmllint
